name: CI · Build & Push polycarp-dev-portfolio

# ────────────────────────────────
# When to run
# ────────────────────────────────
on:
  push:                     # every push to…
    branches: [ main ]      # …the main branch
  workflow_dispatch:        # plus a manual “Run workflow” button

# ────────────────────────────────
# Job definition
# ────────────────────────────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣  Check out the repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣  Set up Docker Buildx (modern builder with cache support)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3️⃣  Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4️⃣  Build and push the image
    - name: Build & push image to Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .                       # build from repo root
        push: true                       # push after build
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/polycarp-dev-portfolio:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/polycarp-dev-portfolio:${{ github.sha }}
