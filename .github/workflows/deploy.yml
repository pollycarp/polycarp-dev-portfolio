name: CI · Build & Deploy polycarp-dev-portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/polycarp-dev-portfolio:latest

    # ✅ FIXED: Removed invalid `if:` expression
    - name: Deploy to Droplet via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DO_HOST }}
        username: root
        key: ${{ secrets.DO_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/polycarp-dev-portfolio:latest
          docker stop polycarp-dev-portfolio || true
          docker rm   polycarp-dev-portfolio || true
          docker run -d \
            --name polycarp-dev-portfolio \
            -p 80:7860 \
            ${{ secrets.DOCKERHUB_USERNAME }}/polycarp-dev-portfolio:latest
